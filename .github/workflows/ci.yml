name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run lint

      - name: Lint (oxlint)
        run: pnpm run lint:ox

      - name: Unit tests
        env:
          GSH_UNIT_TEST: '1'
        run: |
          pnpm test:unit 2>&1 | tee unit-tests.log
          exit ${PIPESTATUS[0]}

      - name: Publish unit test failure summary
        if: failure()
        run: |
          {
            echo '### Unit test failures'
            echo ''
            echo '```'
            grep -E '✖|not ok|AssertionError|Error [|failing tests' unit-tests.log | head -80
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Release reference consistency
        run: pnpm run release:verify

      - name: Production build
        run: pnpm run build && pnpm run build:server

      - name: Database schema drift check
        run: |
          pnpm exec drizzle-kit generate --config server/drizzle.config.ts
          git diff --exit-code -- server/drizzle

      - name: Installer syntax and smoke test
        run: |
          bash -n scripts/install.linux.sh
          bash -n scripts/install-linux-smoke.sh
          bash scripts/install-linux-smoke.sh
