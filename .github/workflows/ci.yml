name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run lint

      - name: Release consistency
        run: pnpm run release:verify

      - name: Unit tests
        env:
          GSH_UNIT_TEST: '1'
        run: pnpm test:unit

      - name: Installer syntax and smoke test
        run: |
          bash -n scripts/install.linux.sh
          bash -n scripts/install-linux-smoke.sh
          bash scripts/install-linux-smoke.sh

      - name: Prepare env for build
        run: |
          cp .env.production.example .env.production
          cp server/.env.production.example server/.env.production

      - name: Production build
        run: pnpm exec vite build
