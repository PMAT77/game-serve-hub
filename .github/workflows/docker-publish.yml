name: Docker Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: panel
            context: .
            file: Dockerfile
            image: ghcr.io/gameserverhub/game-server-hub
          - name: game-dst
            context: docker/game-dst
            file: docker/game-dst/Dockerfile
            image: ghcr.io/gameserverhub/game-server-hub-dst
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GSH_RELEASE_VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('main-{0}', github.sha) }}
            GSH_BUILD_SHA=${{ github.sha }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            完整变更见 [CHANGELOG.md](https://github.com/GameServerHub/game-server-hub/blob/${{ github.ref_name }}/CHANGELOG.md)。

            **镜像**
            - 面板：`ghcr.io/gameserverhub/game-server-hub:${{ github.ref_name }}`
            - DST：`ghcr.io/gameserverhub/game-server-hub-dst:${{ github.ref_name }}`

            **升级**
            - 面板内：「系统设置 → Hub 版本」检查更新
            - 命令行：`docker compose pull && docker compose up -d`

            发布检查清单见 [docs/RELEASE.md](https://github.com/GameServerHub/game-server-hub/blob/main/docs/RELEASE.md)。
