services:
  panel:
    image: ${PANEL_IMAGE:-ghcr.io/pmat77/game-server-hub:v0.2.2}
    build:
      context: .
      dockerfile: docker/unified/Dockerfile
    container_name: game-server-hub-panel
    restart: unless-stopped
    # 统一镜像保持中性（无 ENTRYPOINT/HEALTHCHECK/USER）：面板入口在此显式指定；
    # DST/SteamCMD 子容器由面板创建时显式传入 Cmd/User。
    command: ["node", "dist-server/main.js"]
    ports:
      - "${PANEL_PORT:-8888}:8888"
    # 可选：复制 panel.env.example 为 panel.env；安装脚本亦可通过 --env-file 注入
    environment:
      NODE_ENV: production
      # 计划任务 daily 按「服务器本地时区」计算；容器默认 UTC 会导致每日任务整体偏移
      TZ: ${TZ:-Asia/Shanghai}
      GSH_PANEL_CONTAINER_NAME: game-server-hub-panel
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8888"
      GSH_PANEL_PUBLISHED_PORT: ${PANEL_PORT:-8888}
      DB_PATH: /app/data/game-server-hub.sqlite
      SERVER_LOG_DIR: /app/logs
      GSH_INSTANCES_ROOT: /var/lib/game-server-hub/instances
      GSH_BACKUPS_ROOT: /var/lib/game-server-hub/backups
      DOCKER_HOST: unix:///var/run/docker.sock
      PANEL_IMAGE: ${PANEL_IMAGE:-ghcr.io/pmat77/game-server-hub:v0.2.2}
      # v0.2.2 起面板/DST/SteamCMD 合并为同一统一镜像；三个变量值一致，保留以便旧配置平滑迁移
      GSH_GAME_DST_IMAGE: ${GSH_GAME_DST_IMAGE:-ghcr.io/pmat77/game-server-hub:v0.2.2}
      GSH_STEAMCMD_IMAGE: ${GSH_STEAMCMD_IMAGE:-ghcr.io/pmat77/game-server-hub:v0.2.2}
      # 备选镜像 registry 候选（逗号分隔）：按顺序优先尝试，全部失败后回退主引用
      GSH_IMAGE_MIRRORS: ${GSH_IMAGE_MIRRORS:-}
      GSH_STEAMCMD_CONTAINER_MEMORY_MB: ${GSH_STEAMCMD_CONTAINER_MEMORY_MB:-}
      GSH_STEAMCMD_CONTAINER_MEMORY_SWAP_MB: ${GSH_STEAMCMD_CONTAINER_MEMORY_SWAP_MB:-}
      GSH_STEAMCMD_APP_INFO_MEMORY_MB: ${GSH_STEAMCMD_APP_INFO_MEMORY_MB:-}
      GSH_STEAMCMD_INTER_JOB_COOLDOWN_MS: ${GSH_STEAMCMD_INTER_JOB_COOLDOWN_MS:-}
      STEAMCMD_USERNAME: ${STEAMCMD_USERNAME:-}
      STEAMCMD_PASSWORD: ${STEAMCMD_PASSWORD:-}
      GSH_STEAMCMD_RUN_USER: ${GSH_STEAMCMD_RUN_USER:-}
      GSH_STEAMCMD_BIND_OPTS: ${GSH_STEAMCMD_BIND_OPTS:-}
      GSH_STEAMCMD_DOWNLOAD_REGION: ${GSH_STEAMCMD_DOWNLOAD_REGION:-}
      GSH_STEAMCMD_HTTP_PROXY: ${GSH_STEAMCMD_HTTP_PROXY:-}
      GSH_STEAMCMD_HTTPS_PROXY: ${GSH_STEAMCMD_HTTPS_PROXY:-}
      GSH_STEAMCMD_NO_PROXY: ${GSH_STEAMCMD_NO_PROXY:-}
      GSH_STEAMCMD_NETWORK_MODE: ${GSH_STEAMCMD_NETWORK_MODE:-}
      GSH_STEAMCMD_INSTALL_MAX_ATTEMPTS: ${GSH_STEAMCMD_INSTALL_MAX_ATTEMPTS:-}
      GSH_STEAMCMD_INSTALL_RETRY_DELAYS_MS: ${GSH_STEAMCMD_INSTALL_RETRY_DELAYS_MS:-}
      GSH_DST_CONTAINER_MEMORY_MB: ${GSH_DST_CONTAINER_MEMORY_MB:-}
      GSH_DST_CONTAINER_CPU_QUOTA: ${GSH_DST_CONTAINER_CPU_QUOTA:-}
      # 进服地址逃生口：home/NAT/多网卡环境用；缺这两行时 panel.env 里设了也进不了容器
      GSH_DST_CONNECT_HOST: ${GSH_DST_CONNECT_HOST:-}
      GSH_DST_AUTO_PUBLIC_IP: ${GSH_DST_AUTO_PUBLIC_IP:-}
      GSH_INSTALL_SEED_ENABLED: ${GSH_INSTALL_SEED_ENABLED:-}
      GSH_INSTALL_DEFER_DST_IMAGE_PULL: ${GSH_INSTALL_DEFER_DST_IMAGE_PULL:-}
      GSH_EDITION: ${GSH_EDITION:-community}
      GSH_RUNTIME_MODE: docker
      GSH_STACK_DIR: ${GSH_STACK_DIR:-/opt/game-server-hub}
      GSH_COMPOSE_FILES: ${GSH_COMPOSE_FILES:-docker-compose.yml:docker-compose.bind.yml}
      GSH_GITHUB_REPO: ${GSH_GITHUB_REPO:-PMAT77/game-serve-hub}
    volumes:
      - gsh-data:/app/data
      - gsh-logs:/app/logs
      - gsh-instances:/var/lib/game-server-hub/instances
      - gsh-backups:/var/lib/game-server-hub/backups
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:'+(process.env.SERVER_PORT||8888)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  steamcmd:
    image: ${GSH_STEAMCMD_IMAGE:-ghcr.io/pmat77/game-server-hub:v0.2.2}
    profiles:
      - tools
    entrypoint: ["/bin/true"]

volumes:
  gsh-data:
  gsh-logs:
  gsh-instances:
  gsh-backups:
