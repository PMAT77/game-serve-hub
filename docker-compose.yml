services:
  panel:
    image: ${PANEL_IMAGE:-ghcr.io/pmat77/game-server-hub:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: game-server-hub-panel
    restart: unless-stopped
    ports:
      - "${PANEL_PORT:-3000}:3000"
    # 可选：复制 panel.env.example 为 panel.env；安装脚本亦可通过 --env-file 注入
    environment:
      NODE_ENV: production
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "3000"
      DB_PATH: /app/data/game-server-hub.sqlite
      SERVER_LOG_DIR: /app/logs
      GSH_INSTANCES_ROOT: /var/lib/game-server-hub/instances
      GSH_BACKUPS_ROOT: /var/lib/game-server-hub/backups
      DOCKER_HOST: unix:///var/run/docker.sock
      GSH_GAME_DST_IMAGE: ${GSH_GAME_DST_IMAGE:-ghcr.io/pmat77/game-server-hub-dst:latest}
      GSH_STEAMCMD_IMAGE: ${GSH_STEAMCMD_IMAGE:-cm2network/steamcmd:root}
      GSH_EDITION: ${GSH_EDITION:-community}
    volumes:
      - gsh-data:/app/data
      - gsh-logs:/app/logs
      - gsh-instances:/var/lib/game-server-hub/instances
      - gsh-backups:/var/lib/game-server-hub/backups
      - /var/run/docker.sock:/var/run/docker.sock

  steamcmd:
    image: ${GSH_STEAMCMD_IMAGE:-cm2network/steamcmd:root}
    profiles:
      - tools
    entrypoint: ["/bin/true"]

volumes:
  gsh-data:
  gsh-logs:
  gsh-instances:
  gsh-backups:
