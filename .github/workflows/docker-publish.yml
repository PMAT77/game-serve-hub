name: Container Pipeline

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: container-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/gameserverhub

jobs:
  validate-images:
    name: Validate image (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: panel
            context: .
            file: Dockerfile
          - name: game-dst
            context: docker/game-dst
            file: docker/game-dst/Dockerfile
          - name: steamcmd-base
            context: docker/steamcmd
            file: docker/steamcmd/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build without publishing
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: |
            GSH_RELEASE_VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('main-{0}', github.sha) }}
            GSH_BUILD_SHA=${{ github.sha }}
            STEAMCMD_ARCHIVE_SHA256=${{ vars.STEAMCMD_ARCHIVE_SHA256 }}

  release-guard:
    name: Release guard
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag, package version, changelog, and main ancestry
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="$(node -p "require('./package.json').version")"
          if [[ "${tag}" != "v${version}" ]]; then
            echo "Tag ${tag} does not match package.json version ${version}." >&2
            exit 1
          fi
          if ! grep -Fq "## [${version}]" CHANGELOG.md; then
            echo "CHANGELOG.md has no ${version} release section." >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Release tag ${tag} must point to a commit already merged into main." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        if: github.ref_type == 'tag'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR for manifest checks
        if: github.ref_type == 'tag'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse an existing or partially published release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          images=(game-server-hub game-server-hub-dst steamcmd-base)
          found=0
          for image in "${images[@]}"; do
            target="${IMAGE_PREFIX}/${image}:${GITHUB_REF_NAME}"
            if digest="$(docker buildx imagetools inspect "${target}" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty')" && [[ -n "${digest}" ]]; then
              echo "Release target already exists: ${target}@${digest}" >&2
              found=1
            fi
          done
          if [[ "${found}" -ne 0 ]]; then
            echo "Release tags are immutable. Use a new version instead of overwriting a complete or partial release." >&2
            exit 1
          fi

  publish-staging:
    name: Publish candidate (${{ matrix.name }})
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [validate-images, release-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: panel
            context: .
            file: Dockerfile
            image: ghcr.io/gameserverhub/game-server-hub
          - name: game-dst
            context: docker/game-dst
            file: docker/game-dst/Dockerfile
            image: ghcr.io/gameserverhub/game-server-hub-dst
          - name: steamcmd-base
            context: docker/steamcmd
            file: docker/steamcmd/Dockerfile
            image: ghcr.io/gameserverhub/steamcmd-base
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish candidate image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ matrix.image }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true
          build-args: |
            GSH_RELEASE_VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('main-{0}', github.sha) }}
            GSH_BUILD_SHA=${{ github.sha }}
            STEAMCMD_ARCHIVE_SHA256=${{ vars.STEAMCMD_ARCHIVE_SHA256 }}

      - name: Record candidate digest
        run: echo "- ${{ matrix.image }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  promote-images:
    name: Promote complete image set
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: publish-staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify candidate set and promote tags
        shell: bash
        run: |
          set -euo pipefail
          images=(game-server-hub game-server-hub-dst steamcmd-base)
          candidate_tag="candidate-${{ github.run_id }}-${{ github.run_attempt }}"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            tags=("${{ github.ref_name }}")
          else
            tags=(main latest)
          fi
          remote_digest() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r '.digest // empty'
          }

          # Finish every read-only check before creating any public tag.
          for image in "${images[@]}"; do
            source="${IMAGE_PREFIX}/${image}:${candidate_tag}"
            digest="$(remote_digest "${source}")"
            if [[ -z "${digest}" ]]; then
              echo "Missing candidate image: ${source}" >&2
              exit 1
            fi
          done
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            for image in "${images[@]}"; do
              target="${IMAGE_PREFIX}/${image}:${{ github.ref_name }}"
              if existing="$(remote_digest "${target}" 2>/dev/null)" && [[ -n "${existing}" ]]; then
                echo "Refusing to overwrite immutable release tag: ${target}@${existing}" >&2
                exit 1
              fi
            done
          fi

          for image in "${images[@]}"; do
            source="${IMAGE_PREFIX}/${image}:${candidate_tag}"
            source_digest="$(remote_digest "${source}")"
            for tag in "${tags[@]}"; do
              target="${IMAGE_PREFIX}/${image}:${tag}"
              docker buildx imagetools create --prefer-index=false --tag "${target}" "${source}"
              target_digest="$(remote_digest "${target}")"
              if [[ "${target_digest}" != "${source_digest}" ]]; then
                echo "Digest mismatch: ${target} expected ${source_digest}, got ${target_digest}" >&2
                exit 1
              fi
              echo "Promoted ${target}@${target_digest}"
            done
          done

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: promote-images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: read
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release image manifest
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          images=(game-server-hub game-server-hub-dst steamcmd-base)
          remote_digest() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r '.digest // empty'
          }
          printf '{\n  "version": "%s",\n  "commit": "%s",\n  "images": [\n' "${tag}" "${GITHUB_SHA}" > release-images.json
          for index in "${!images[@]}"; do
            image="${images[$index]}"
            reference="${IMAGE_PREFIX}/${image}:${tag}"
            digest="$(remote_digest "${reference}")"
            if [[ -z "${digest}" ]]; then
              echo "Unable to resolve digest for ${reference}" >&2
              exit 1
            fi
            comma=','
            if [[ "${index}" -eq $((${#images[@]} - 1)) ]]; then comma=''; fi
            printf '    {"name":"%s","reference":"%s","digest":"%s"}%s\n' "${image}" "${reference}" "${digest}" "${comma}" >> release-images.json
          done
          printf '  ]\n}\n' >> release-images.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-images.json
          body: |
            本 Release 的面板、DST 与 SteamCMD 镜像已作为同一完整集合发布。

            每个镜像的不可变 digest 见附件 `release-images.json`。安装与升级请使用版本 tag 或附件中的 digest，不要依赖 `latest`。
