name: Sync Images To ACR

on:
  workflow_call:
    inputs:
      tags:
        description: Comma-separated tags to sync
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tags:
        description: Comma-separated tags to sync (e.g. latest,main,v1.0.0)
        required: false
        default: latest,main

permissions:
  contents: read
  packages: read

jobs:
  sync-acr:
    runs-on: ubuntu-latest
    env:
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
    steps:
      - name: Validate ACR credentials
        id: config
        run: |
          if [[ -z "${ACR_REGISTRY}" ]]; then
            echo "ACR is not configured; skipping optional mirror sync."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "${{ secrets.ACR_USERNAME }}" || -z "${{ secrets.ACR_PASSWORD }}" ]]; then
            echo "ACR credentials are not configured; skipping optional mirror sync."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Resolve tags
        if: steps.config.outputs.enabled == 'true'
        id: tags
        run: |
          registry_raw="${ACR_REGISTRY}"
          registry_raw="${registry_raw#http://}"
          registry_raw="${registry_raw#https://}"
          registry_host="${registry_raw%%/*}"
          if [[ -z "${registry_host}" ]]; then
            echo "Invalid ACR_REGISTRY: ${ACR_REGISTRY}"
            exit 1
          fi
          if [[ -z "${ACR_NAMESPACE}" ]]; then
            ACR_NAMESPACE="game-server-hub"
          fi
          registry_path="${registry_raw#${registry_host}}"
          registry_path="${registry_path#/}"
          if [[ -n "${registry_path}" ]]; then
            ACR_NAMESPACE="${registry_path%%/*}"
          fi
          echo "ACR_REGISTRY_HOST=${registry_host}" >> "$GITHUB_ENV"
          echo "ACR_NAMESPACE_EFFECTIVE=${ACR_NAMESPACE}" >> "$GITHUB_ENV"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            raw="${{ github.event.inputs.tags }}"
          else
            raw="${{ inputs.tags }}"
          fi
          tags=$(echo "${raw}" | tr ',' '\n' | awk '{gsub(/^[ \t]+|[ \t]+$/, ""); if (length) print}' | paste -sd ' ' -)
          if [[ -z "${tags}" ]]; then
            tags="latest main"
          fi
          echo "values=${tags}" >> "$GITHUB_OUTPUT"

      - name: Login GHCR
        if: steps.config.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login ACR
        if: steps.config.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ACR_REGISTRY_HOST }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Sync and verify images from GHCR to ACR
        if: steps.config.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          tags="${{ steps.tags.outputs.values }}"
          namespace="${ACR_NAMESPACE_EFFECTIVE}"
          images=("game-server-hub" "game-server-hub-dst" "steamcmd-base")
          remote_digest() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r '.digest // empty'
          }
          for image in "${images[@]}"; do
            for tag in ${tags}; do
              src="ghcr.io/gameserverhub/${image}:${tag}"
              dst="${ACR_REGISTRY_HOST}/${namespace}/${image}:${tag}"
              echo "Sync: ${src} -> ${dst}"
              source_digest="$(remote_digest "${src}")"
              if [[ -z "${source_digest}" ]]; then
                echo "Unable to resolve source digest for ${src}" >&2
                exit 1
              fi
              destination_digest=""
              if destination_digest="$(remote_digest "${dst}" 2>/dev/null)"; then
                if [[ "${destination_digest}" == "${source_digest}" ]]; then
                  echo "Already synchronized: ${dst}@${destination_digest}"
                  continue
                fi
                if [[ "${tag}" != "latest" && "${tag}" != "main" ]]; then
                  echo "Refusing to overwrite immutable release tag ${dst}: ${destination_digest} != ${source_digest}" >&2
                  exit 1
                fi
              fi
              docker buildx imagetools create --prefer-index=false --tag "${dst}" "${src}"
              verified_digest="$(remote_digest "${dst}")"
              if [[ "${verified_digest}" != "${source_digest}" ]]; then
                echo "Digest verification failed for ${dst}: expected ${source_digest}, got ${verified_digest}" >&2
                exit 1
              fi
              echo "Verified: ${dst}@${verified_digest}"
            done
          done
