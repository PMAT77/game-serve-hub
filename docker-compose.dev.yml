# Development overlay: bind-mount 源码，容器内 pnpm install，避免 Windows 下 Docker build context 扫 node_modules。
# node_modules 挂在命名卷上，依赖是否要重装由 scripts/dev-deps-guard.sh 按 pnpm-lock.yaml 指纹判断。
# 内存：panel(tsx watch)+web(Vite) 双容器，宿主机看到 ~1GiB+ 为开发常态；生产见 PANEL_IMAGE 单容器。
services:
  panel:
    build: !reset null
    image: node:22-bookworm-slim
    container_name: game-server-hub-panel
    # 单容器被 OOM/误杀（exit 137）后自动恢复；docker stop 不会触发重启
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "-c", "corepack enable && sh scripts/dev-deps-guard.sh && pnpm run dev:server:watch"]
    environment:
      NODE_ENV: development
      # 与生产一致：容器默认 UTC 会让 daily 计划任务偏移 8 小时
      TZ: ${TZ:-Asia/Shanghai}
      GSH_PANEL_CONTAINER_NAME: game-server-hub-panel
      GSH_DEV_COMPOSE_QUIET: "1"
      NODE_NO_WARNINGS: "1"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8888"
      GSH_PANEL_PUBLISHED_PORT: ${PANEL_PORT:-8888}
      DB_PATH: /app/data/game-server-hub.sqlite
      SERVER_LOG_DIR: /app/logs
      GSH_INSTANCES_ROOT: /var/lib/game-server-hub/instances
      GSH_BACKUPS_ROOT: /var/lib/game-server-hub/backups
      DOCKER_HOST: unix:///var/run/docker.sock
      # v0.2.2 起面板/DST/SteamCMD 合并为同一统一镜像
      GSH_GAME_DST_IMAGE: ${GSH_GAME_DST_IMAGE:-ghcr.io/pmat77/game-server-hub:v0.4.0}
      GSH_STEAMCMD_IMAGE: ${GSH_STEAMCMD_IMAGE:-ghcr.io/pmat77/game-server-hub:v0.4.0}
      # 面板内一键更新的 updater 容器镜像（留空自动挑选）
      GSH_PANEL_UPDATER_IMAGE: ${GSH_PANEL_UPDATER_IMAGE:-}
      GSH_STEAMCMD_CONTAINER_MEMORY_MB: ${GSH_STEAMCMD_CONTAINER_MEMORY_MB:-}
      GSH_STEAMCMD_CONTAINER_MEMORY_SWAP_MB: ${GSH_STEAMCMD_CONTAINER_MEMORY_SWAP_MB:-}
      GSH_STEAMCMD_APP_INFO_MEMORY_MB: ${GSH_STEAMCMD_APP_INFO_MEMORY_MB:-}
      GSH_STEAMCMD_INTER_JOB_COOLDOWN_MS: ${GSH_STEAMCMD_INTER_JOB_COOLDOWN_MS:-}
      GSH_STEAMCMD_APP_UPDATE_TIMEOUT_MS: ${GSH_STEAMCMD_APP_UPDATE_TIMEOUT_MS:-}
      GSH_STEAMCMD_RUN_USER: ${GSH_STEAMCMD_RUN_USER:-}
      GSH_STEAMCMD_BIND_OPTS: ${GSH_STEAMCMD_BIND_OPTS:-}
      # 进服地址逃生口：home/NAT/多网卡环境用；缺这两行时 panel.env 里设了也进不了容器
      GSH_DST_CONNECT_HOST: ${GSH_DST_CONNECT_HOST:-}
      GSH_DST_AUTO_PUBLIC_IP: ${GSH_DST_AUTO_PUBLIC_IP:-}
      STEAMCMD_USERNAME: ${STEAMCMD_USERNAME:-}
      STEAMCMD_PASSWORD: ${STEAMCMD_PASSWORD:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-superadmin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-123456}
    volumes:
      - .:/app
      - panel-node-modules:/app/node_modules
      - gsh-data:/app/data
      - gsh-logs:/app/logs
      - gsh-instances:/var/lib/game-server-hub/instances
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${PANEL_PORT:-8888}:8888"
    deploy:
      resources:
        limits:
          memory: ${GSH_PANEL_MEMORY_LIMIT:-3G}

  web:
    image: node:22-bookworm-slim
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "-c", "corepack enable && sh scripts/dev-deps-guard.sh && pnpm run dev:web"]
    environment:
      VITE_APP_API_BASEURL: http://panel:8888
      VITE_ENABLE_PROXY: "true"
      VITE_DEV_WEB_PORT: ${VITE_DEV_WEB_PORT:-9527}
      GSH_DEV_COMPOSE_QUIET: "1"
    volumes:
      - .:/app
      - web-node-modules:/app/node_modules
    ports:
      - "${VITE_DEV_WEB_PORT:-9527}:${VITE_DEV_WEB_PORT:-9527}"
    depends_on:
      - panel
    deploy:
      resources:
        limits:
          memory: ${GSH_WEB_MEMORY_LIMIT:-1536M}

volumes:
  panel-node-modules:
  web-node-modules:
