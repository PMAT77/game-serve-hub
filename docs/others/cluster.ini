; ============================================================
; 饥荒联机版 (DST) 专用服务器 - cluster.ini 完整配置文件
; 文件编码：UTF-8 无BOM（请使用 Notepad++ 或 VSCode 编辑）
; 文件位置：保存存档的集群文件夹下，例如 MyDediServer/cluster.ini
; ============================================================

; -------------------- GAMEPLAY (游戏玩法设置) --------------------
[GAMEPLAY]
; 游戏模式：easy(轻松模式)，endless(无尽模式)，survival(生存模式)，wilderness(荒野模式)，darkandwildernes(暗无天日模式)
game_mode = survival

; 最大玩家数量：允许同时在线的人数，范围1-64
max_players = 6

; 玩家对战(PVP)：是否允许玩家之间互相攻击
pvp = false

; 服务器无人时暂停：服务器内无任何玩家时，世界是否暂停
pause_when_empty = true

; 投票功能：是否允许玩家发起投票（如踢人、重置世界等）
vote_enabled = true

; -------------------- NETWORK (网络设置) --------------------
[NETWORK]
; 服务器名称：将在游戏大厅显示的服务器名称
cluster_name = 我的专属服务器

; 服务器描述：在大厅点击服务器后展示的详情介绍
cluster_description = 欢迎来到我的服务器，请友善游玩。

; 服务器密码：进入服务器所需的密码，留空则为公开房间
cluster_password = 

; 服务器标签：决定服务器在大厅的分类
; cooperative(合作)、competitive(竞争)、social(社交)、madness(疯狂)
cluster_intention = cooperative

; 局域网模式：设置为 true 则服务器仅在局域网内可见（不显示在线上列表）
lan_only_cluster = false

; 离线模式：完全离线模式，不向Klei服务器注册（不显示在线上列表）
offline_cluster = false

; 网络刷新率：服务器每秒更新频率，范围15-60，默认15。越高网络越平滑，但占用更多CPU
tick_rate = 15

; 白名单保留位：为白名单玩家保留的可用空位数量
whitelist_slots = 0

; -------------------- MISC (杂项设置) --------------------
[MISC]
; 控制台：是否允许在服务端后台输入Lua指令
console_enabled = true

; 最大快照数：可保留的服务器回档存档数量，数值越大占用磁盘越多
max_snapshots = 6

; -------------------- SHARD (服务器分片/洞穴设置) --------------------
[SHARD]
; 分片功能：是否开启多世界（洞穴与地面互通必须设为 true）
shard_enabled = true

; 绑定IP：主世界监听从世界（洞穴）连接的IP地址
bind_ip = 127.0.0.1

; 主世界IP：从世界（洞穴）主动去连接主世界的IP地址
master_ip = 127.0.0.1

; 主世界端口：主世界和从世界之间内部通信的UDP端口（默认10888）
master_port = 10888

; 集群密钥：主世界和从世界之间验证身份的共享密码（请务必修改默认密码）
cluster_key = supersecretkey

; -------------------- STEAM (Steam组设置) --------------------
[STEAM]
; Steam组限制：是否只允许特定Steam组成员进入服务器
steam_group_only = false

; Steam组ID：当启用上述限制时，填写对应Steam组的数字ID
steam_group_id = 0

; Steam组管理员：是否自动授予Steam组管理员服务器内的管理权限
steam_group_admins = false