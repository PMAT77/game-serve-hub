name: Sync Images To ACR

on:
  workflow_run:
    workflows:
      - Docker Publish
    types:
      - completed
  workflow_dispatch:
    inputs:
      tags:
        description: Comma-separated tags to sync (e.g. latest,main,v1.0.0)
        required: false
        default: latest,main

permissions:
  contents: read
  packages: read

jobs:
  sync-acr:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
    steps:
      - name: Validate ACR credentials
        run: |
          if [[ -z "${ACR_REGISTRY}" ]]; then
            echo "Missing secret ACR_REGISTRY"
            exit 1
          fi
          if [[ -z "${{ secrets.ACR_USERNAME }}" || -z "${{ secrets.ACR_PASSWORD }}" ]]; then
            echo "Missing secrets ACR_USERNAME / ACR_PASSWORD"
            exit 1
          fi

      - name: Resolve tags
        id: tags
        run: |
          if [[ -z "${ACR_NAMESPACE}" ]]; then
            ACR_NAMESPACE="game-server-hub"
          fi
          echo "acr_namespace=${ACR_NAMESPACE}" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            raw="${{ github.event.inputs.tags }}"
          else
            raw="latest,main"
          fi
          tags=$(echo "${raw}" | tr ',' '\n' | awk '{gsub(/^[ \t]+|[ \t]+$/, ""); if (length) print}' | paste -sd ' ' -)
          if [[ -z "${tags}" ]]; then
            tags="latest main"
          fi
          echo "values=${tags}" >> "$GITHUB_OUTPUT"

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Sync images from GHCR to ACR
        run: |
          set -euo pipefail
          tags="${{ steps.tags.outputs.values }}"
          namespace="${{ steps.tags.outputs.acr_namespace }}"
          images=("game-server-hub" "game-server-hub-dst" "steamcmd-base")
          for image in "${images[@]}"; do
            for tag in ${tags}; do
              src="ghcr.io/gameserverhub/${image}:${tag}"
              dst="${ACR_REGISTRY}/${namespace}/${image}:${tag}"
              echo "Sync: ${src} -> ${dst}"
              if docker pull "${src}"; then
                docker tag "${src}" "${dst}"
                docker push "${dst}"
              else
                echo "Skip unavailable source image: ${src}"
              fi
            done
          done
