version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      production-dependencies:
        patterns:
          - '*'
        exclude-patterns:
          - '@fantastic-admin/*'
        dependency-type: production
      dev-dependencies:
        patterns:
          - '*'
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
